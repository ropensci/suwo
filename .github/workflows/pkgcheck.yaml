name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # Run on every push to main
  push:
    branches-ignore: [gh-pages]

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      xc_api_key: ${{ secrets.XENO_CANTO_API_KEY }}
    steps:
      # pkgcheck-action checks out the repo on the host, then runs checks in a
      # Docker container. libgit2 inside the container refuses to open a repo
      # owned by a different user unless it is marked as safe:
      # "repository path '/github/workspace/' is not owned by current user".
      # The container reads git config from $RUNNER_TEMP/_github_home.
      - name: Mark workspace as safe for pkgcheck container
        run: |
          mkdir -p "${RUNNER_TEMP}/_github_home"
          git config --file "${RUNNER_TEMP}/_github_home/.gitconfig" \
            --add safe.directory /github/workspace

      - uses: ropensci-review-tools/pkgcheck-action@main
