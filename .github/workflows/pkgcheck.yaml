name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # Run on every push to main
  push:
    branches-ignore: [gh-pages]

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      xc_api_key: ${{ secrets.XENO_CANTO_API_KEY }}
    steps:
      # pkgcheck-action checks out the repo on the host, then runs checks in a
      # Docker container. libgit2 inside the container refuses to open a repo
      # owned by a different user unless it is marked as safe:
      # "repository path '/github/workspace/' is not owned by current user".
      # The container reads git config from $RUNNER_TEMP/_github_home.
      - name: Mark workspace as safe for pkgcheck container
        run: |
          mkdir -p "${RUNNER_TEMP}/_github_home"
          git config --file "${RUNNER_TEMP}/_github_home/.gitconfig" \
            --add safe.directory /github/workspace

      - name: Wait for CI workflows on this commit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.sha
            const pattern = /(cmd|coverage)/i

            for (let i = 0; i < 60; i++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                branch: 'main',
                per_page: 100
              })

              const runs = data.workflow_runs.filter(
                run => run.head_sha === sha && pattern.test(run.name || '')
              )

              if (runs.length > 0 && runs.every(run => run.status === 'completed')) {
                const failed = runs.filter(run => run.conclusion !== 'success')
                if (failed.length > 0) {
                  core.setFailed(
                    `Required CI workflows failed for ${sha}: ` +
                    failed.map(run => `${run.name} (${run.conclusion})`).join(', ')
                  )
                }
                return
              }

              await new Promise(resolve => setTimeout(resolve, 15000))
            }

            core.setFailed(
              `Timed out waiting for cmd/coverage workflows to complete for ${sha}.`
            )

      - uses: ropensci-review-tools/pkgcheck-action@main
